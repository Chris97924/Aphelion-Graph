name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows + py3.11 listed first: per 2026-04-19 cp950 precedent it is
        # the most fragile cell, so surfacing failures there earliest saves
        # the later cells from wasted runtime.
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.10", "3.12"]

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,signer]"

      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=term-missing --cov-fail-under=80

      # Report-only, and deliberately a SECOND run rather than more --cov flags
      # on the one above: adding them would fold benchmarks/ and scripts/ into
      # the same total the 80% floor is measured against, which would silently
      # redefine what that floor means. The floor stays scoped to src/; this step
      # exists so the harness and the scripts stop being invisible.
      #
      # --cov-fail-under=0 is what makes it report-only: these packages are not
      # gated, and a number nobody can see is not a number. Baseline at the time
      # this step was added: benchmarks/ + scripts/ = 85% (3427 statements, 514
      # uncovered); lowest benchmark modules were corpus.py 84%, run.py 85%,
      # metrics/_stats.py 93%. scripts/check_forbidden_terms.py and
      # scripts/generate_samples.py report 0% — the former only ever runs as a
      # subprocess, so coverage cannot see it.
      #
      # No test paths are passed. `pytest ... benchmarks scripts` collects
      # nothing (neither directory holds tests), reports a uniform 0% and exits
      # 5, which would fail the job while measuring nothing.
      #
      # continue-on-error because "report-only" has to mean it. This step
      # re-runs the whole suite to collect a different coverage scope, so
      # without it an unrelated flake here — the Hypothesis deadline in
      # tests/test_diff_fuzz_hardening.py is a live example — would fail a job
      # whose gating test step had already passed. Real failures are still
      # caught: they fail the gated step above first.
      - name: Report coverage for benchmarks and scripts (not gated)
        continue-on-error: true
        run: |
          pytest --cov=benchmarks --cov=scripts --cov-report=term --cov-fail-under=0 -q

      - name: Smoke test init -> validate -> verify (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/aphelion-smoke"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          aphe --version
          aphe init "$WORK/pkg"
          aphe validate "$WORK/pkg"
          aphe pack "$WORK/pkg" "$WORK/out.aphelion.tar"
          aphe unpack "$WORK/out.aphelion.tar" "$WORK/unpacked"
          aphe verify "$WORK/unpacked"

      - name: Smoke test init -> validate -> verify (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'aphelion-smoke'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Path $work | Out-Null
          aphe --version
          aphe init "$work/pkg"
          aphe validate "$work/pkg"
          aphe pack "$work/pkg" "$work/out.aphelion.tar"
          aphe unpack "$work/out.aphelion.tar" "$work/unpacked"
          aphe verify "$work/unpacked"
